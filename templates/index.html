<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant 🤖</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        label {
            font-weight: 600;
            margin-top: 10px;
            display: block;
        }

        select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
            font-size: 14px;
        }

        select:focus, textarea:focus {
            border-color: #667eea;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .response-box {
            height: 100%;
            padding: 20px;
            border-radius: 15px;
            background: #f4f6ff;
            border-left: 6px solid #667eea;
            display: flex;
            flex-direction: column;
        }

        .response-box b {
            font-size: 18px;
            color: #333;
        }

        #response {
            margin-top: 15px;
            color: #555;
            line-height: 1.6;
        }

        /* Responsive for mobile */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="container">
    <h1>AI Assistant 🤖</h1>

    <div class="grid">

        <!-- LEFT SIDE (INPUTS) -->
        <div class="left">
            <label>Function</label>
            <select id="function">
                <option value="qa">Q&A</option>
                <option value="summarize">Summarization</option>
                <option value="creative">Creative Writing</option>
            </select>

            <label>Variant</label>
            <select id="variant">
                <option value="direct">Direct</option>
                <option value="detailed">Detailed</option>
                <option value="creative">Creative</option>
            </select>

            <label>Your Input</label>
            <textarea id="input" placeholder="Type your question here..."></textarea>

            <button onclick="ask()">Ask AI</button>
        </div>

        <!-- RIGHT SIDE (OUTPUT) -->
        <div class="right">
            <div class="response-box">
                <b>Response:</b>
                <p id="response">Your answer will appear here...</p>
            </div>
        </div>

    </div>
</div>

<script>
    async function ask() {
        const func = document.getElementById("function").value;
        const variant = document.getElementById("variant").value;
        const input = document.getElementById("input").value;

        if (!input.trim()) {
            alert("Please enter some input!");
            return;
        }

        document.getElementById("response").innerText = "⏳ Generating response...";

        try {
            const res = await fetch("/api/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ function: func, variant: variant, input: input })
            });

            const data = await res.json();

            document.getElementById("response").innerText =
                data.answer || "Error: " + JSON.stringify(data);

        } catch (err) {
            document.getElementById("response").innerText = "❌ Server error!";
        }
    }
</script>

</body>
</html>
